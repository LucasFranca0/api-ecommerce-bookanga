global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'bookanga-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['bookanga-api:8080']
        labels:
          application: 'Bookanga E-commerce'
          environment: 'docker'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
