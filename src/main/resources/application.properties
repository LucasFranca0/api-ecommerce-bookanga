# Database PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://bookanga-postgres:5432/bookanga_db
spring.datasource.username=bookanga
spring.datasource.password=bookanga123
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true

# Disable data.sql
spring.sql.init.mode=never

# Logging
#logging.level.com.products.controller=DEBUG
#logging.level.org.springframework=DEBUG

# Validation
spring.mvc.throw-exception-if-no-handler-found=true

# Actuator - Metrics for Prometheus/Grafana
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.export.prometheus.enabled=true
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always

