databaseChangeLog:
  - changeSet:
      id: 001-create-product-table
      author: bookanga
      changes:
        - createTable:
            tableName: product
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: author
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: publication_year
                  type: INTEGER
              - column:
                  name: price
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: isbn
                  type: VARCHAR(20)
                  constraints:
                    unique: true
              - column:
                  name: genre
                  type: VARCHAR(100)
              - column:
                  name: language
                  type: VARCHAR(50)
              - column:
                  name: product_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: volume
                  type: INTEGER
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        - createIndex:
            indexName: idx_product_type
            tableName: product
            columns:
              - column:
                  name: product_type
        - createIndex:
            indexName: idx_isbn
            tableName: product
            columns:
              - column:
                  name: isbn
