databaseChangeLog:
  - changeSet:
      id: 003-create-product-hist-table
      author: bookanga
      changes:
        - createTable:
            tableName: product_hist
            columns:
              - column:
                  name: hist_id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
              - column:
                  name: author
                  type: VARCHAR(255)
              - column:
                  name: publication_year
                  type: INTEGER
              - column:
                  name: price
                  type: DECIMAL(10,2)
              - column:
                  name: isbn
                  type: VARCHAR(20)
              - column:
                  name: genre
                  type: VARCHAR(100)
              - column:
                  name: language
                  type: VARCHAR(50)
              - column:
                  name: product_type
                  type: VARCHAR(20)
              - column:
                  name: volume
                  type: INTEGER
              - column:
                  name: operation_type
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
                  remarks: "INSERT, UPDATE, DELETE"
              - column:
                  name: changed_by
                  type: VARCHAR(100)
                  remarks: "User who made the change"
              - column:
                  name: changed_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: changes_json
                  type: JSONB
                  remarks: "JSON with old and new values"
        - createIndex:
            indexName: idx_product_hist_product_id
            tableName: product_hist
            columns:
              - column:
                  name: product_id
        - createIndex:
            indexName: idx_product_hist_changed_at
            tableName: product_hist
            columns:
              - column:
                  name: changed_at

