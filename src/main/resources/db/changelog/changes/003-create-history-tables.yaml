  - changeSet:
      id: 003-create-sale-hist-table
      author: bookanga
      changes:
        - createTable:
            tableName: sale_hist
            columns:
              - column:
                  name: hist_id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: sale_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
              - column:
                  name: date
                  type: TIMESTAMP
              - column:
