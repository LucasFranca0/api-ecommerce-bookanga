services:
  postgres:
    image: postgres:15-alpine
    container_name: bookanga-postgres
    environment:
      POSTGRES_DB: bookanga_db
      POSTGRES_USER: bookanga
      POSTGRES_PASSWORD: bookanga123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bookanga-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookanga -d bookanga_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookanga-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://bookanga-postgres:5432/bookanga_db
      SPRING_DATASOURCE_USERNAME: bookanga
      SPRING_DATASOURCE_PASSWORD: bookanga123
    ports:
      - "8080:8080"
    networks:
      - bookanga-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: bookanga-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    networks:
      - bookanga-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: bookanga-grafana
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    networks:
      - bookanga-network
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  bookanga-network:
    driver: bridge
